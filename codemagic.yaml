workflows:
  android-apk-workflow:
    name: SportIA Predict - APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (Release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

# 👇 NOUVEAU WORKFLOW POUR LE WEB 👇
web-workflow:
  name: SportIA Predict - Web
  instance_type: mac_mini_m2
  max_build_duration: 60
  environment:
    flutter: stable
  scripts:
    - name: Get Flutter packages
      script: flutter pub get
    - name: Build Web
      script: flutter build web --release
  artifacts:
    - build/web/**
  publishing:
# Optionnel : publication automatique (voir Étape 3)
    email:
      recipients:
        - votre-email@exemple.com # Remplacez par votre email
      notify:
        success: true
        failure: true
