workflows:
  android-apk-workflow:
    name: SportIA Predict - APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.44.0        # ← figé, plus de surprise
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (Release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - ton-email@exemple.com
        notify:
          success: true
          failure: true

  web-workflow:
    name: SportIA Predict - Web
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.0
      java: 17
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/web/**
    publishing:
      email:
        recipients:
          - ton-email@exemple.com
        notify:
          success: true
          failure: true
